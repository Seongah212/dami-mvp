<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f3"><meta name="description" content="DAMI — compact K-beauty gift kits from Busan. Demo MVP."><title>DAMI | K-Beauty Gifts from Busan</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1b2e47;background:#eeece9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7ea6cb;outline-offset:2px}.shell{max-width:460px;min-height:100dvh;background:#faf8f5;margin:auto;box-shadow:0 0 70px #00000012;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;height:66px;background:#faf8f5f2;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid #e9e4df}.logo{font-size:29px;letter-spacing:5px;font-weight:300;margin-left:17px;color:#1e314a}.iconbtn{background:none;border:0;color:#1e314a;font-size:21px;padding:10px}.section{padding:18px}.hero{height:360px;background:#d6e4ed url('assets/busan-hero.webp') center/cover;border-radius:23px;overflow:hidden;position:relative;display:flex;align-items:flex-start}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#e5eef8ed 0%,#e5eef8a8 33%,transparent 65%)}.hero-content{position:relative;padding:25px 23px;max-width:330px}.hero h1{font-size:31px;letter-spacing:-1px;line-height:1.13;margin:0 0 13px;font-weight:600;color:#1a2d48}.hero p{line-height:1.5;font-size:14px;max-width:280px;margin:0}.card{border:1px solid #ede8e3;border-radius:23px;background:#fffdfb;padding:19px;margin-top:14px;box-shadow:0 4px 15px #3f30290a}.card.tint{background:#f2eeeb}.card.blue{background:#e9f0f7}.label{font-size:12px;color:#777d85;margin-bottom:7px}.fieldgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.field{width:100%;background:white;border:1px solid #dcdce0;border-radius:12px;padding:12px 10px;color:#27364c;min-width:0}.card h2{font-size:19px;margin:0 0 13px;letter-spacing:-.4px}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0;text-align:center}.benefit{font-size:11px;line-height:1.4;color:#303b48}.bubble{display:grid;place-items:center;width:44px;height:44px;background:#e5edf6;border-radius:50%;margin:0 auto 7px;font-size:22px}.benefit:nth-child(2) .bubble{background:#f4e2df}.benefit:nth-child(3) .bubble{background:#f1e9df}.primary{width:100%;background:#25282d;color:#fff;border:none;border-radius:35px;padding:17px 15px;font-size:16px;font-weight:600;margin-top:13px}.secondary{background:#e5edf6;color:#183554;border:0;border-radius:25px;padding:12px 16px;font-weight:600}.headline{font-size:29px;margin:4px 0 8px;letter-spacing:-1px;font-weight:650}.sub{color:#70737b;font-size:14px;line-height:1.45;margin:0 0 18px}.kitcard{display:grid;grid-template-columns:106px 1fr;gap:13px;padding:10px;margin:12px 0;background:#fffdfb;border:1px solid #eee7e3;border-radius:20px}.kitcard img{width:106px;height:128px;object-fit:cover;border-radius:12px}.kitinfo{min-width:0;display:flex;flex-direction:column}.kitname{font-size:17px;font-weight:650;margin:6px 0}.kitdesc{font-size:12px;color:#777b83;line-height:1.45}.kitbottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-bottom:5px}.price{font-weight:700;font-size:16px;white-space:nowrap}.stepper{display:flex;align-items:center;border:1px solid #ddd;border-radius:19px;background:#fff;overflow:hidden}.stepper button{border:0;background:none;padding:7px 10px;font-size:19px;color:#243854}.stepper span{min-width:18px;text-align:center;font-weight:600}.bottom{position:fixed;z-index:30;bottom:0;width:100%;max-width:460px;display:flex;justify-content:space-around;background:#faf8f5f7;backdrop-filter:blur(12px);border-top:1px solid #e7e2dd;padding:11px 5px max(12px,env(safe-area-inset-bottom))}.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#84858b;min-width:75px;font-size:12px}.tab .symbol{font-size:23px}.tab.active{color:#204568;font-weight:700}.tab.active:after{content:"";background:#88afd1;width:48px;height:3px;border-radius:6px}.summaryrow{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ebe6e1;font-size:14px}.summaryrow:last-child{border-bottom:0}.summaryrow strong{white-space:nowrap}.total{background:#f0edf0;border-radius:14px;margin-top:14px;padding:17px;display:flex;justify-content:space-between;font-size:20px;font-weight:700}.badge{display:inline-flex;gap:7px;align-items:center;background:#e8f5e9;color:#257042;padding:9px 12px;border-radius:23px;font-size:13px}.chip{display:inline-flex;gap:6px;padding:10px 14px;border:1px solid #e3dbd6;background:#fff;border-radius:22px;font-size:13px}.chip.sel{background:#dce9f7;border-color:#bdd1e5}.chiprow{display:flex;gap:7px;flex-wrap:wrap}.plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}.muted{color:#7f8188;font-size:12px}.mini-total{display:flex;justify-content:space-between;padding:12px 0;font-weight:650}.alert{border-radius:14px;background:#f7ede5;padding:12px;color:#73503d;font-size:12px;line-height:1.45;margin-top:12px}.qr{width:136px;height:136px;image-rendering:pixelated;margin:6px auto;display:block}.pickuphero{height:230px;background:#d9e7f1 url('assets/busan-hero.webp') center/cover;border-radius:20px;margin-bottom:17px}.map{width:100%;height:104px;border-radius:13px;background:linear-gradient(45deg,#eaf0eb 48%,#d5e7f5 49%,#d5e7f5 61%,#f0efeb 62%);display:flex;align-items:center;justify-content:center;color:#285577;font-size:14px}.plan-kits{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ece6e1}.plan-kits img{width:55px;height:56px;object-fit:cover;border-radius:9px}.titlebar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 15px}.empty{text-align:center;padding:30px 10px;color:#777}.smallprint{text-align:center;color:#92949b;font-size:11px;padding:11px 0}.linkbtn{border:0;background:none;color:#24557b;text-decoration:underline;font-size:12px}.hide{display:none!important}@media(min-width:650px){body{padding:28px 0}.shell{border-radius:28px;overflow:hidden;min-height:840px}.bottom{bottom:0}} 
</style></head><body><div class="shell"><header class="top"><button class="iconbtn" id="menu" aria-label="Open menu">☰</button><div class="logo">DAMI</div><button class="iconbtn" id="cart" aria-label="My order">♧</button></header><main id="app" aria-live="polite"></main><nav class="bottom" aria-label="Main navigation"><button class="tab" data-page="home"><span class="symbol">♧</span>Gift Kits</button><button class="tab" data-page="order"><span class="symbol">▤</span>My Order</button><button class="tab" data-page="pickup"><span class="symbol">♧</span>Pickup</button></nav></div>
<script>
'use strict';
const products=[{name:'Discovery Kit',desc:'Popular sheet masks to try',price:14900,img:'assets/discovery.webp'},{name:'Daily Kit',desc:'Sun cream and daily care',price:24900,img:'assets/daily.webp'},{name:'Premium Kit',desc:'Best-loved serum and masks',price:34900,img:'assets/premium.webp'}];
const initial={page:'home',ship:'',date:'2026-11-15',qty:[1,2,1],budget:100000,recipients:{Family:1,Friends:2,Coworkers:1},order:null};
let state;try{state={...initial,...JSON.parse(localStorage.getItem('dami-demo-v1')||'{}')}}catch{state={...initial}};
const app=document.getElementById('app'),fmt=n=>'₩'+n.toLocaleString('en-US'),total=()=>state.qty.reduce((n,q,i)=>n+q*products[i].price,0),count=()=>state.qty.reduce((a,b)=>a+b,0);
function save(){localStorage.setItem('dami-demo-v1',JSON.stringify(state))}function navigate(page){state.page=page;save();render();window.scrollTo({top:0,behavior:'instant'})}
function cruiseCard(){return `<div class="card tint"><h2>Your Cruise</h2><div class="fieldgrid"><label><div class="label">Ship</div><select id="ship" class="field"><option value="">Select your ship</option>${['Ocean Star','Pacific Dream','Sea Explorer','Other cruise ship'].map(x=>`<option value="${x}" ${state.ship===x?'selected':''}>${x}</option>`).join('')}</select></label><label><div class="label">Busan Date</div><input class="field" id="date" type="date" value="${state.date}"></label></div></div>`}
function home(){return `<div class="section"><section class="hero"><div class="hero-content"><h1>No time to shop in Busan?</h1><p>Your K-beauty gifts will be ready when you're back at the port.</p></div></section>${cruiseCard()}<div class="benefits"><div class="benefit"><span class="bubble">✦</span>Best-selling<br>K-beauty</div><div class="benefit"><span class="bubble">♡</span>Pre-order<br>on board</div><div class="benefit"><span class="bubble">⌖</span>Pickup<br>at the port</div></div><button class="primary" data-go="kits">Browse Gift Kits →</button><button style="width:100%;margin-top:12px" class="secondary" data-go="planner">Try Gift Planner · Plan for multiple people</button><p class="smallprint">DAMI · Demonstration website · No real payment</p></div>`}
function kits(){return `<div class="section"><h1 class="headline">Choose Your Gift Kits</h1><p class="sub">Curated from K-beauty best-sellers loved by global visitors.</p>${products.map((p,i)=>`<article class="kitcard"><img src="${p.img}" alt="DAMI ${p.name} pouch"><div class="kitinfo"><div class="kitname">${p.name}</div><div class="kitdesc">${p.desc}</div><div class="kitbottom"><div class="price">${fmt(p.price)}</div><div class="stepper"><button data-qty="${i}" data-delta="-1" aria-label="Remove one ${p.name}">−</button><span>${state.qty[i]}</span><button data-qty="${i}" data-delta="1" aria-label="Add one ${p.name}">+</button></div></div></div></article>`).join('')}<div class="mini-total"><span>${count()} kits selected</span><span>${fmt(total())}</span></div><button class="primary" data-go="order">Continue · ${count()} kits →</button><button class="secondary" style="width:100%;margin-top:12px" data-go="planner">Need gifts for several people? Gift Planner →</button></div>`}
function planner(){return `<div class="section"><div class="titlebar"><h1 class="headline">Gift Planner</h1><button class="linkbtn" data-go="kits">Browse Kits</button></div><p class="sub">Tell us your total budget and who you're gifting. We'll suggest an affordable kit combination.</p><div class="card"><label><div class="label">Total Budget (₩)</div><input id="budget" class="field" inputmode="numeric" type="number" min="14900" max="10000000" step="1000" value="${state.budget}"></label><div class="label" style="margin-top:18px">Recipients</div>${Object.entries(state.recipients).map(([n,q])=>`<div class="plan-row"><strong>${n}</strong><div class="stepper"><button data-rec="${n}" data-delta="-1" aria-label="Remove ${n}">−</button><span>${q}</span><button data-rec="${n}" data-delta="1" aria-label="Add ${n}">+</button></div></div>`).join('')}<button class="primary" data-go="recommend">Find My Gift Kits →</button></div><p class="smallprint">Recommendations are illustrative and use preset kit options.</p></div>`}
function computePlan(){const people=Object.values(state.recipients).reduce((a,b)=>a+b,0);if(!people)return null;let budget=Number(state.budget),n=people,counts=[0,0,0];const slots=[];for(const [group,q] of Object.entries(state.recipients))for(let j=0;j<q;j++)slots.push(group);
// Choose 1 kit per recipient. Upgrade priority Family > Friends > Coworkers.
if(n*14900>budget)return {error:`At least ${fmt(n*14900)} is needed for ${n} Discovery Kits.`};counts[0]=n;let rem=budget-n*14900;const priority=[...slots.keys()].sort((a,b)=>({Family:0,Friends:1,Coworkers:2}[slots[a]]??3)-({Family:0,Friends:1,Coworkers:2}[slots[b]]??3));const assigned=Array(n).fill(0);for(const idx of priority){if(rem>=20000){assigned[idx]=2;rem-=20000}else if(rem>=10000){assigned[idx]=1;rem-=10000}}counts=[0,0,0];assigned.forEach(x=>counts[x]++);return {counts,spent:counts.reduce((a,b,i)=>a+b*products[i].price,0),people,slots,assigned}}
function recommend(){const plan=computePlan();return `<div class="section"><h1 class="headline">Your Gift Plan</h1><p class="sub">Thoughtfully selected for your Busan trip.</p><div class="card blue"><div class="mini-total"><span>Budget</span><strong>${fmt(Number(state.budget)||0)}</strong></div><div class="mini-total"><span>Recipients</span><strong>${Object.values(state.recipients).reduce((a,b)=>a+b,0)} people</strong></div></div>${plan?.error?`<div class="alert">${plan.error}</div><button class="primary" data-go="planner">Edit Budget →</button>`:plan?`<div class="card"><h2>Recommended Gift Kits</h2>${products.map((p,i)=>plan.counts[i]?`<div class="plan-kits"><img src="${p.img}" alt="${p.name}"><div style="flex:1"><strong>${p.name}</strong><div class="muted">${fmt(p.price)} each</div></div><strong>× ${plan.counts[i]}</strong></div>`:'').join('')}<div class="total"><span>Estimated Total</span><span>${fmt(plan.spent)}</span></div><p class="muted">Remaining budget: ${fmt(Number(state.budget)-plan.spent)}</p><button class="primary" id="applyplan">Add Suggested Kits to Order →</button></div><button class="secondary" data-go="planner" style="margin-top:12px;width:100%">Edit Gift Plan</button>`:'<div class="alert">Enter your recipients to get a recommendation.</div>'}</div>`}
function order(){let has=count()>0;return `<div class="section"><h1 class="headline">Your Gift Order</h1><div class="card blue"><h2>Your Cruise</h2><div class="summaryrow"><span>Ship</span><strong>${state.ship||'Not selected'}</strong></div><div class="summaryrow"><span>Busan</span><strong>${state.date||'Not selected'}</strong></div><div class="summaryrow"><span>All aboard</span><strong>3:30 PM (demo)</strong></div><button class="linkbtn" data-go="home">Edit cruise details</button></div><div class="card"><h2>Order Summary</h2>${has?products.map((p,i)=>state.qty[i]?`<div class="plan-kits"><img src="${p.img}" alt="${p.name}"><div style="flex:1;font-size:14px"><strong>${p.name} × ${state.qty[i]}</strong></div><strong>${fmt(state.qty[i]*p.price)}</strong></div>`:'').join(''):'<div class="empty">No kits selected yet.</div>'}<div class="total"><span>Total</span><span>${fmt(total())}</span></div></div><div class="card"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:23px">▤</span><div><strong>Pay with international card</strong><div class="muted">Demo only · No card details collected</div></div></div></div><div class="alert">This is a prototype for a startup competition. "Place Order" creates a simulated order only. Nothing will be charged or prepared for pickup.</div><button class="primary" id="place" ${!has?'disabled style="opacity:.5"':''}>Place Demo Order →</button>${state.order?`<button class="secondary" data-go="pickup" style="width:100%;margin-top:10px">View Pickup Details →</button>`:''}</div>`}
function pickup(){const order=state.order;return `<div class="section"><div class="pickuphero" role="img" aria-label="Busan harbor with cruise ship and DAMI pouch"></div><h1 class="headline">${order?'Ready for Pickup':'Pickup Information'}</h1><p class="sub">Pick up on your way back to the ship.</p><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><span class="badge">● ${order?'Ready · Demo':'Demo not placed'}</span><strong>${order?order.id:'—'}</strong></div></div><div class="card"><h2>⌖ &nbsp;Busan Port Cruise Terminal</h2><p class="muted">Proposed pickup location — not an operating DAMI desk.</p><div class="map">⌖ &nbsp; Busan Port area · Map illustration</div></div><div class="card"><h2>◷ &nbsp;Pickup Window</h2><strong>${order?order.date:'Nov 15'} · 2:00 – 3:15 PM</strong><p class="muted">Before all aboard at 3:30 PM · Example time</p></div><div class="card" style="text-align:center"><h2>Demo pickup QR</h2>${order?`<img class="qr" src="assets/demo-qr.png" alt="Sample QR code, not valid for real pickup"><strong>Show this QR at the DAMI pickup desk</strong><p class="muted">Illustration only — this QR cannot redeem an order.</p>`:'<p class="muted">Place a demo order to see your pickup code.</p>'}</div><button class="primary" id="guide">View Pickup Guide →</button></div>`}
function render(){const pages={home,kits,planner,recommend,order,pickup};app.innerHTML=pages[state.page]?.()||home();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',(state.page==='kits'||state.page==='home'||state.page==='planner'||state.page==='recommend'?'home':state.page)===b.dataset.page));}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}const tb=e.target.closest('[data-page]');if(tb){navigate(tb.dataset.page);return}const q=e.target.closest('[data-qty]');if(q){let i=Number(q.dataset.qty);state.qty[i]=Math.max(0,Math.min(30,state.qty[i]+Number(q.dataset.delta)));save();render();return}const rec=e.target.closest('[data-rec]');if(rec){const k=rec.dataset.rec;state.recipients[k]=Math.max(0,Math.min(30,state.recipients[k]+Number(rec.dataset.delta)));save();render();return}if(e.target.id==='applyplan'){let p=computePlan();if(!p?.error&&p){state.qty=p.counts;save();navigate('order')}return}if(e.target.id==='place'){if(!count())return;if(!state.ship){alert('Please choose your cruise ship on the Home screen.');navigate('home');return}if(!state.date){alert('Please choose your Busan date.');navigate('home');return}state.order={id:'DM2026-015',date:state.date,ship:state.ship,qty:[...state.qty],total:total(),demo:true};save();navigate('pickup');return}if(e.target.id==='guide'){alert('DEMO ONLY: DAMI has not opened a real pickup desk. This screen shows the planned collection process near Busan Port.');return}if(e.target.id==='menu'){let pick=prompt('Go to: home, kits, planner, order, pickup','planner');if(pick&&['home','kits','planner','order','pickup'].includes(pick.toLowerCase()))navigate(pick.toLowerCase());return}if(e.target.id==='cart')navigate('order')});
document.addEventListener('change',e=>{if(e.target.id==='ship')state.ship=e.target.value;if(e.target.id==='date')state.date=e.target.value;if(e.target.id==='budget')state.budget=Math.max(0,Math.min(10000000,Number(e.target.value)||0));save()});render();
</script></body></html>
